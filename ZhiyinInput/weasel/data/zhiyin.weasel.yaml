# 知音输入法 weasel.custom.yaml 模板
# encoding: utf-8
# Weasel 使用 BGR 色值。

customization:
  distribution_code_name: Weasel
  generator: "Zhiyin IME"
  modified_time: "2026-08-25"

patch:
  "show_notifications": true
  "show_notifications_time": 1200
  "global_ascii": false

  "style/antialias_mode": clear_type
  "style/ascii_tip_follow_cursor": false
  "style/color_scheme": zhiyin_red
  "style/font_face": "Microsoft YaHei UI"
  "style/label_font_face": "Microsoft YaHei UI"
  "style/comment_font_face": "Microsoft YaHei UI"
  "style/font_point": 16
  "style/label_font_point": 12
  "style/comment_font_point": 11
  "style/candidate_abbreviate_length": 0
  "style/click_to_capture": false
  "style/horizontal": false
  "style/fullscreen": false
  "style/inline_preedit": false
  "style/preedit_type": composition
  "style/display_tray_icon": true
  "style/label_format": "%s."
  "style/mark_text": ""
  "style/hover_type": semi_light
  "style/paging_on_scroll": false
  "style/layout/align_type": center
  "style/layout/max_width": 600
  "style/layout/min_width": 240
  "style/layout/max_height": 260
  "style/layout/border_width": 1
  "style/layout/margin_x": 16
  "style/layout/margin_y": 14
  "style/layout/spacing": 12
  "style/layout/candidate_spacing": 6
  "style/layout/hilite_spacing": 4
  "style/layout/hilite_padding": 4
  "style/layout/round_corner": 8
  "style/layout/corner_radius": 8
  "style/layout/shadow_radius": 6
  "style/layout/shadow_offset_x": 0
  "style/layout/shadow_offset_y": 4
  "style/layout/linespacing": 8

