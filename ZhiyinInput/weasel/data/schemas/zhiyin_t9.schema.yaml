# Rime schema
# encoding: utf-8
#
# ====================================================================
# 知音 九键·默认版 (zhiyin_t9) — 基于玄离199/t9 升级
# ====================================================================
# 知音相伴，所想即所得 —— 九键打字，越打越懂你
#
# 按键布局（与手机九键保持一致，区别于九键位置版 zhiyin_t9_pos）:
#   1: 标点    2: abc    3: def
#   4: ghi     5: jkl    6: mno
#   7: pqrs    8: tuv    9: wxyz
#   0: 空格
#
# 知音相对原作的增强：
#   ① 候选词 comment 原生显示完整拼音，方便识别同码音节
#   ② 小键盘 `/`、`*` 切换前后候选并同步查看其拼音
#   ③ `[` / `]` 前后翻页，查看更多候选词
#   ④ 候选词 page_size 默认 7（原作 5）
#   ⑤ 与独立悬浮工具栏的中英、标点和方案快捷键联动
#
# 默认按键：
#   - 九键编码输入：小键盘 KP_1~KP_0（需开启 NumLock）
#     及 key_binder/bindings 自定义的任意键
#   - 主键盘横排数字 1~7：候选窗出现时快捷选字（第 1~7 个候选）
#   - 空格：上屏首选；Tab/Shift+Tab：循环候选
#   - 小键盘 `/`、`*`：切换前后候选并查看其拼音
#   - `[` / `]`：前后翻页，查看更多词
#   - 减号(-)/等号(=)、小键盘减/加：翻页
#   - 小键盘回车：上屏首选
#   - BackSpace：删除 / Escape：清空
#   - Shift：临时英文 / Control+Shift+2：中英
# ====================================================================

schema:
  schema_id: zhiyin_t9
  name: "知音九键"
  version: "1.1.0"
  author:
    - 李子旺 (知音输入法开发者)
    - 玄离199 (原作 t9 作者)
  description: |
    知音·默认九键方案。数字与手机九键一一对应。
    候选词显示完整拼音注释；小键盘 `/`、`*` 切换拼音，`-`、`+` 翻页。
    按键映射可在 zhiyin_t9.custom.yaml 中自定义。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - options:
      - zh_hans
      - zh_hant
    reset: 0   # 默认输出简化字
    states:
      - 简化字
      - 傳統漢字
    abbrev: [ 简, 繁 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - selector
    - punctuator
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - script_translator
  filters:
    - simplifier@zh_variant
    - uniquifier

speller:
  alphabet: '23456789'
  initials: '23456789'
  delimiter: "'"
  algebra:
    - xlit/ü/8/
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: t9
  prism: t9
  enable_completion: true
  enable_sentence: true
  enable_user_dict: true
  enable_encoder: false
  preedit_format: []
  # 预览栏显示拼音而非数字编码
  preedit_uses_spelling: true
  # 使用 Rime 原生候选注释显示九键编码对应的拼音
  spelling_hints: 9
  always_show_comments: true
  comment_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

punctuator:
  half_shape:
    '1': { commit: ， }
    '0': { commit: ' ' }
    '.': { commit: 。 }
  full_shape:
    '1': { commit: ， }
    '0': { commit: '　' }
    '.': { commit: 。 }

key_binder:
  bindings:
    # ---- 主键盘横排数字键 1~7：快捷选字 ----
    - {accept: 1, send: exclam,      when: has_menu}
    - {accept: 1, send: 1,           when: composing}
    - {accept: 1, send: F20,         when: always}
    - {accept: 2, send: at,          when: has_menu}
    - {accept: 2, send: 2,           when: composing}
    - {accept: 2, send: F20,         when: always}
    - {accept: 3, send: numbersign,  when: has_menu}
    - {accept: 3, send: 3,           when: composing}
    - {accept: 3, send: F20,         when: always}
    - {accept: 4, send: dollar,      when: has_menu}
    - {accept: 4, send: 4,           when: composing}
    - {accept: 4, send: F20,         when: always}
    - {accept: 5, send: percent,     when: has_menu}
    - {accept: 5, send: 5,           when: composing}
    - {accept: 5, send: F20,         when: always}
    - {accept: 6, send: F20,         when: has_menu}
    - {accept: 6, send: 6,           when: composing}
    - {accept: 6, send: F20,         when: always}
    - {accept: 7, send: F20,         when: has_menu}
    - {accept: 7, send: 7,           when: composing}
    - {accept: 7, send: F20,         when: always}
    # 8、9 超出每页候选数（7），吞掉
    - {accept: 8, send: 8, when: composing}
    - {accept: 8, send: F20, when: always}
    - {accept: 9, send: 9, when: composing}
    - {accept: 9, send: F20, when: always}
    # ---- emacs 风格编辑键 ----
    - { when: composing, accept: Control+p, send: Up }
    - { when: composing, accept: Control+n, send: Down }
    - { when: composing, accept: Control+b, send: Left }
    - { when: composing, accept: Control+f, send: Right }
    - { when: composing, accept: Control+a, send: Home }
    - { when: composing, accept: Control+e, send: End }
    - { when: composing, accept: Control+d, send: Delete }
    - { when: composing, accept: Control+k, send: Shift+Delete }
    - { when: composing, accept: Control+h, send: BackSpace }
    - { when: composing, accept: Control+g, send: Escape }
    # ---- 翻页 ----
    - { when: has_menu, accept: minus,  send: Page_Up }
    - { when: has_menu, accept: equal,  send: Page_Down }
    - { when: paging,  accept: comma,  send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }
    # ---- 模式切换 ----
    - { when: always, accept: Control+Shift+1, select: .next }
    - { when: always, accept: Control+Shift+2, toggle: ascii_mode }
    - { when: always, accept: Control+Shift+3, toggle: full_shape }
    - { when: always, accept: Control+Shift+4, toggle: zh_hans }
    - { when: always, accept: Shift+space, toggle: full_shape }
    - { when: always, accept: Control+period, toggle: ascii_punct }
    # ---- 拼音切换 / 更多候选（兼容原生 librime）----
    - { when: has_menu, accept: backslash, send: Tab }
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    # ---- 数字小键盘 KP_1~KP_0 映射为九键编码 ----
    - {accept: KP_1, send: 1, when: always}
    - {accept: KP_2, send: 2, when: always}
    - {accept: KP_3, send: 3, when: always}
    - {accept: KP_4, send: 4, when: always}
    - {accept: KP_5, send: 5, when: always}
    - {accept: KP_6, send: 6, when: always}
    - {accept: KP_7, send: 7, when: always}
    - {accept: KP_8, send: 8, when: always}
    - {accept: KP_9, send: 9, when: always}
    - {accept: KP_0, send: 0, when: always}
    # ---- 小键盘附近：拼音、翻页、标点与上屏 ----
    - {accept: KP_Divide,   send: Shift+Tab, when: has_menu}
    - {accept: KP_Divide,   send: slash,     when: always}
    - {accept: KP_Multiply, send: Tab,       when: has_menu}
    - {accept: KP_Subtract, send: Page_Up,   when: paging}
    - {accept: KP_Subtract, send: minus,     when: always}
    - {accept: KP_Add,      send: Page_Down, when: has_menu}
    - {accept: KP_Add,      send: plus,      when: always}
    - {accept: KP_Decimal,  send: period,    when: always}
    - {accept: KP_Enter,    send: space,     when: has_menu}
    - {accept: KP_Enter,    send: Return,    when: composing}

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'

zh_variant:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: none
  tags: [ abc ]
  excluded_types: [ punct ]

menu:
  # 知音默认每页 7 个候选（原作 5）
  page_size: 7
  alternative_select_keys: '!@#$%^&'

__patch:
  - zhiyin_t9.custom:/patch?
