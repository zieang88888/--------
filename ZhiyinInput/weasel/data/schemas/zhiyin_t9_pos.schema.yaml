# Rime schema
# encoding: utf-8
#
# ====================================================================
# 知音 九键·位置版 (zhiyin_t9_pos)
# ====================================================================
# 基于玄离199/t9_pos 升级。
# 小键盘按【物理位置】对应手机九键：
#
#   小键盘布局      对应手机九键
#     7 8 9            1(标点) 2(abc) 3(def)
#     4 5 6            4(ghi) 5(jkl) 6(mno)
#     1 2 3            7(pqrs) 8(tuv) 9(wxyz)
#       0              0(空格)
#
# 与默认版 zhiyin_t9 的区别：按键位置不同（KP_7→1 而不是 KP_1→1）。
# 其它拼音提示、候选翻页和工具栏联动能力完全相同。
# ====================================================================

schema:
  schema_id: zhiyin_t9_pos
  name: "知音九键·位置"
  version: "1.0.0"
  author:
    - 李子旺 (知音输入法开发者)
    - 玄离199 (原作 t9_pos 作者)
  description: |
    知音·九键位置对应版。小键盘 789/456/123 ↔ 手机 123/456/789。
    主键盘数字键选候选。按键映射可在 zhiyin_t9_pos.custom.yaml 中自定义。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - options:
      - zh_hans
      - zh_hant
    reset: 0
    states:
      - 简化字
      - 傳統漢字
    abbrev: [ 简, 繁 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - selector
    - punctuator
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - script_translator
  filters:
    - simplifier@zh_variant
    - uniquifier

speller:
  alphabet: '23456789'
  initials: '23456789'
  delimiter: "'"
  algebra:
    - xlit/ü/8/
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: t9
  prism: t9
  enable_completion: true
  enable_sentence: true
  enable_user_dict: true
  enable_encoder: false
  preedit_format: []
  preedit_uses_spelling: true
  spelling_hints: 9
  comment_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

punctuator:
  half_shape:
    '1': { commit: ， }
    '0': { commit: ' ' }
    '.': { commit: 。 }
  full_shape:
    '1': { commit: ， }
    '0': { commit: '　' }
    '.': { commit: 。 }

key_binder:
  bindings:
    # 主键盘 1~7 快捷选字
    - {accept: 1, send: exclam,      when: has_menu}
    - {accept: 1, send: 1,           when: composing}
    - {accept: 1, send: F20,         when: always}
    - {accept: 2, send: at,          when: has_menu}
    - {accept: 2, send: 2,           when: composing}
    - {accept: 2, send: F20,         when: always}
    - {accept: 3, send: numbersign,  when: has_menu}
    - {accept: 3, send: 3,           when: composing}
    - {accept: 3, send: F20,         when: always}
    - {accept: 4, send: dollar,      when: has_menu}
    - {accept: 4, send: 4,           when: composing}
    - {accept: 4, send: F20,         when: always}
    - {accept: 5, send: percent,     when: has_menu}
    - {accept: 5, send: 5,           when: composing}
    - {accept: 5, send: F20,         when: always}
    - {accept: 6, send: F20,         when: has_menu}
    - {accept: 6, send: 6,           when: composing}
    - {accept: 6, send: F20,         when: always}
    - {accept: 7, send: F20,         when: has_menu}
    - {accept: 7, send: 7,           when: composing}
    - {accept: 7, send: F20,         when: always}
    - {accept: 8, send: 8, when: composing}
    - {accept: 8, send: F20, when: always}
    - {accept: 9, send: 9, when: composing}
    - {accept: 9, send: F20, when: always}
    # emacs 编辑
    - { when: composing, accept: Control+p, send: Up }
    - { when: composing, accept: Control+n, send: Down }
    - { when: composing, accept: Control+b, send: Left }
    - { when: composing, accept: Control+f, send: Right }
    - { when: composing, accept: Control+a, send: Home }
    - { when: composing, accept: Control+e, send: End }
    - { when: composing, accept: Control+d, send: Delete }
    - { when: composing, accept: Control+k, send: Shift+Delete }
    - { when: composing, accept: Control+h, send: BackSpace }
    - { when: composing, accept: Control+g, send: Escape }
    # 翻页
    - { when: has_menu, accept: minus,  send: Page_Up }
    - { when: has_menu, accept: equal,  send: Page_Down }
    - { when: paging,  accept: comma,  send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }
    # 模式切换
    - { when: always, accept: Control+Shift+1, select: .next }
    - { when: always, accept: Control+Shift+2, toggle: ascii_mode }
    - { when: always, accept: Control+Shift+3, toggle: full_shape }
    - { when: always, accept: Control+Shift+4, toggle: zh_hans }
    - { when: always, accept: Shift+space, toggle: full_shape }
    - { when: always, accept: Control+period, toggle: ascii_punct }
    # 拼音切换 / 更多候选（兼容原生 librime）
    - { when: has_menu, accept: backslash, send: Tab }
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    # 小键盘按位置映射
    - {accept: KP_7, send: 1, when: always}
    - {accept: KP_8, send: 2, when: always}
    - {accept: KP_9, send: 3, when: always}
    - {accept: KP_4, send: 4, when: always}
    - {accept: KP_5, send: 5, when: always}
    - {accept: KP_6, send: 6, when: always}
    - {accept: KP_1, send: 7, when: always}
    - {accept: KP_2, send: 8, when: always}
    - {accept: KP_3, send: 9, when: always}
    - {accept: KP_0, send: 0, when: always}
    - {accept: KP_Subtract, send: minus,  when: always}
    - {accept: KP_Add,      send: equal,  when: always}
    - {accept: KP_Decimal,  send: period, when: always}
    - {accept: KP_Divide,   send: slash,  when: always}
    - {accept: KP_Enter,    send: Return, when: composing}

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'

zh_variant:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: none
  tags: [ abc ]
  excluded_types: [ punct ]

menu:
  page_size: 7
  alternative_select_keys: '!@#$%^&'

__patch:
  - zhiyin_t9_pos.custom:/patch?
